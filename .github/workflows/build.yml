name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build in Fedora container
        run: |
          podman run --rm -v "$(pwd)":/src -w /src fedora:43 bash -c '
            dnf install -y --setopt=install_weak_deps=False \
              meson gcc gettext desktop-file-utils appstream \
              glib2-devel gtk4-devel libadwaita-devel \
              json-glib-devel vte291-gtk4-devel git &&
            meson setup builddir &&
            meson compile -C builddir &&
            meson test -C builddir --print-errorlogs || true
          '
