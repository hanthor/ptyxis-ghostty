name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    container: fedora:43
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            meson \
            gcc \
            gettext \
            desktop-file-utils \
            appstream \
            glib2-devel \
            gtk4-devel \
            libadwaita-devel \
            json-glib-devel \
            vte291-gtk4-devel

      - name: Setup build directory
        run: meson setup builddir

      - name: Build
        run: meson compile -C builddir

      - name: Run tests
        run: meson test -C builddir --print-errorlogs || true
