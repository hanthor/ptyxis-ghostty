name: Flatpak CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build-ghostty:
    name: Build libghostty
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build libghostty-vt
        run: |
          cd subprojects/ghostty
          zig build -Doptimize=ReleaseFast -Dapp-runtime=none
          echo "=== zig-out/lib contents ==="
          ls -la zig-out/lib/
          echo "=== zig-out/include contents ==="
          ls -la zig-out/include/
          ls -la zig-out/include/ghostty/ | head -10

      - name: Upload ghostty zig-out
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-zig-out
          path: subprojects/ghostty/zig-out/

  flatpak:
    name: Flatpak Build
    needs: build-ghostty
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Restore ghostty zig-out
        uses: actions/download-artifact@v4
        with:
          name: ghostty-zig-out
          path: subprojects/ghostty/zig-out

      - name: Verify ghostty artifacts
        run: |
          echo "=== subprojects/ghostty/zig-out/lib ==="
          ls -la subprojects/ghostty/zig-out/lib/
          echo "=== libghostty-vt.so.0.1.0 ==="
          file subprojects/ghostty/zig-out/lib/libghostty-vt.so.0.1.0

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PtyxisGhostty.flatpak
          manifest-path: dev.hanthor.PtyxisGhostty.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PtyxisGhostty
          path: PtyxisGhostty.flatpak

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PtyxisGhostty.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
