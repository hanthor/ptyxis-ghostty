name: Flatpak CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build-ghostty:
    name: Build libghostty
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build libghostty
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gettext
          cd subprojects/ghostty
          zig build -Doptimize=ReleaseFast -Dapp-runtime=none
          mkdir -p "${{ github.workspace }}/ghostty-build/ghostty"
          cp zig-out/lib/libghostty.so "${{ github.workspace }}/ghostty-build/"
          cp include/ghostty.h "${{ github.workspace }}/ghostty-build/"
          cp -r include/ghostty/* "${{ github.workspace }}/ghostty-build/ghostty/"
          ls -la "${{ github.workspace }}/ghostty-build/"

      - name: Upload ghostty build
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-build
          path: ghostty-build/

  flatpak:
    name: Flatpak Build
    needs: build-ghostty
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-49
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Download ghostty build
        uses: actions/download-artifact@v4
        with:
          name: ghostty-build
          path: ghostty-build

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: PtyxisGhostty.flatpak
          manifest-path: dev.hanthor.PtyxisGhostty.json
          cache-key: flatpak-builder-${{ github.sha }}

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PtyxisGhostty
          path: PtyxisGhostty.flatpak

      - name: Upload Release Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PtyxisGhostty.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
